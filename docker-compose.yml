services:
  mysql:
    image: mysql:8.0
    container_name: qlhs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: quan_ly_ho_so
      TZ: Asia/Ho_Chi_Minh
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # Chỉ chạy 1 lần duy nhất khi volume mysql_data còn trống
      - ./quan-ly-ho-so-backend/src/main/resources/database/quanlihoso-with-council-attachment.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qlhs-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build: ./quan-ly-ho-so-backend
    container_name: qlhs-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # Biến môi trường ghi đè application.properties (không cần sửa code)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/quan_ly_ho_so?serverTimezone=Asia/Ho_Chi_Minh&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_UPLOAD_DIR: /app/uploads
      APP_LUCENE_PROJECT_INDEX_PATH: /app/data/lucene/projects
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: INFO
    volumes:
      - uploads_data:/app/uploads
      - lucene_data:/app/data

  frontend:
    build: ./quan-ly-ho-so-frontend
    container_name: qlhs-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  lucene_data:
